name: PiaoPal Release

# Only an explicit version tag assembles a draft. Publishing remains a separate step.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag, for example v0.0.1'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag, project identity, and release notes
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, pathlib, plistlib, re, subprocess, xml.etree.ElementTree as ET
          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag):
              raise SystemExit('Expected a release tag such as v0.0.1')
          version = tag[1:]
          with open('Info.plist', 'rb') as source:
              info = plistlib.load(source)
          if info['CFBundleShortVersionString'] != version:
              raise SystemExit('Tag must match CFBundleShortVersionString')
          if info['CFBundleName'] != 'PiaoPal':
              raise SystemExit('Expected PiaoPal project identity')
          windows_version = ET.parse('Windows/Directory.Build.props').findtext('./PropertyGroup/Version')
          if windows_version != version:
              raise SystemExit('Windows version must match release tag')
          notes = pathlib.Path('releases') / f'{tag}.md'
          if not notes.is_file() or not notes.read_text(encoding='utf-8').strip():
              raise SystemExit(f'Missing release notes: {notes}')
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          tagged = subprocess.check_output(['git', 'rev-parse', f'refs/tags/{tag}^{{commit}}'], text=True).strip()
          if commit != tagged:
              raise SystemExit('Checked out commit does not match the requested tag')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'version={version}\ntag={tag}\ncommit={commit}\n')
          PY
      - name: Check cross-platform manifest requirements
        run: python3 -m unittest discover -s Tests/Release -v

  macos:
    name: Build macOS Universal
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - name: Test languages, sprites, motion, stats, and updates
        run: bash scripts/test-macos.sh
      - name: Build and verify DMG, ZIP, and SHA-256 manifest
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: bash scripts/package-macos.sh "$RELEASE_VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: piaopal-release-macos
          path: |
            dist/*-macOS-universal.dmg
            dist/*-macOS-universal.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0

  windows:
    name: Build Windows ${{ matrix.runtime }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: win-x64
            runner: windows-2025
          - runtime: win-arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: ga
      - name: Test Windows motion, storage, native UI, and restart
        shell: pwsh
        run: ./scripts/test-windows.ps1 -RuntimeIdentifier '${{ matrix.runtime }}'
      - name: Publish and verify Windows ZIP
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: ./scripts/package-windows.ps1 -RuntimeIdentifier '${{ matrix.runtime }}' -Version $env:RELEASE_VERSION
      - uses: actions/upload-artifact@v7
        with:
          name: piaopal-release-windows-${{ matrix.runtime }}
          path: |
            dist/*-Windows-*.zip
            dist/SHA256SUMS-Windows-*.txt
          if-no-files-found: error
          compression-level: 0
      - name: Retain native test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-windows-diagnostics-${{ matrix.runtime }}
          path: build/windows-test-results/
          if-no-files-found: ignore
          retention-days: 7

  draft:
    name: Assemble verified draft release
    needs: [prepare, macos, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: piaopal-release-*
          path: downloaded
      - name: Verify downloaded packages against build checksums
        run: |
          set -euo pipefail
          mkdir -p dist
          for package_dir in downloaded/*; do
            (cd "$package_dir" && sha256sum --check SHA256SUMS*.txt)
            find "$package_dir" -maxdepth 1 -type f \( -name '*.zip' -o -name '*.dmg' \) -exec cp {} dist/ \;
          done
      - name: Require Mac and both Windows packages before release
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: python3 scripts/release-checksums.py --version "$RELEASE_VERSION" --directory dist --platform all
      - name: Create or update a draft without changing published releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          notes="releases/$RELEASE_TAG.md"
          assets=(dist/*.dmg dist/*.zip dist/SHA256SUMS.txt)
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > "$RUNNER_TEMP/release-is-draft"; then
            if [[ "$(cat "$RUNNER_TEMP/release-is-draft")" != true ]]; then
              echo 'This release is already published; its files will not be replaced.' >&2
              exit 1
            fi
            gh release edit "$RELEASE_TAG" --title "PiaoPal $RELEASE_TAG" --notes-file "$notes"
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --verify-tag --draft --title "PiaoPal $RELEASE_TAG" --notes-file "$notes"
          fi
          echo 'PiaoPal draft ready. Review installation and package contents before publishing.' >> "$GITHUB_STEP_SUMMARY"
